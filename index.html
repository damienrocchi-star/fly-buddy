<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fly Buddy</title>
  <meta name="description" content="Fly selection and rigging advice from live river conditions. Free, works offline.">
  <meta name="theme-color" content="#0f5e66">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Fly Buddy">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1><svg class="logo" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="rgba(255,255,255,.14)"/><path d="M18 7v11a5 5 0 1 1-10 0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M18 9c3-2.6 7-2.6 7.5 0-2.4 1.2-5 1.8-7.5 1.2" fill="#f5b942"/><path d="M18 11.5c2.6.6 5 2.6 5 5.2-2.6 0-4.4-1.4-5-2.6" fill="#f5b942" opacity=".75"/></svg>Fly Buddy</h1>
    <span id="net" class="net"></span>
  </header>
  <main id="app" aria-live="polite"><p class="muted pad">Loading…</p></main>
  <nav class="tabs" id="tabs">
    <button data-tab="water" class="on"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 7c2-1.5 4-1.5 6 0s4 1.5 6 0 4-1.5 6 0"/><path d="M2 12c2-1.5 4-1.5 6 0s4 1.5 6 0 4-1.5 6 0"/><path d="M2 17c2-1.5 4-1.5 6 0s4 1.5 6 0 4-1.5 6 0"/></svg>River</button>
    <button data-tab="setups"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4v9a4 4 0 1 1-8 0"/><path d="M6 13l-2-2"/><path d="M14 6c2.5-2 5.5-2 6 0-2 1-4 1.5-6 1"/><path d="M14 8c2 .5 4 2 4 4-2 0-3.5-1-4-2"/></svg>Setups</button>
    <button data-tab="log"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2"/><path d="M19 19v3H6a2 2 0 0 1 0-4"/><path d="M8 7h7M8 11h5"/></svg>Log</button>
    <button data-tab="gear"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20 19 5"/><circle cx="8.5" cy="15.5" r="3"/><path d="M8.5 15.5l1.5-1.5"/><path d="M19 5c1 3 1 6-1 9"/><path d="M18 14v3"/></svg>Gear</button>
    <button data-tab="more"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>More</button>
  </nav>
  <script type="module" src="app.js"></script>
</body>
</html>
